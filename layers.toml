# The one home of the layer classification (DRIFT D-05; read by tools/layers, nothing else).
# Every tracked path must match one layer or one [[exclude]] row; tools/layers refuses an
# unclassified path by name (rc 2). A path takes the FIRST layer whose glob matches, in this
# file's order: tests are declared before apparatus so tools/tests/**, ops/db/tests/** and
# .claude/hooks/tests/** leave apparatus. Globs: `*` within one path segment, `**` across
# segments, a trailing `/` is "anything under". No count literal lives here (AP-28).

[layer.product]
paths = ["crates/*/src/**", "crates/*/build.rs", "crates/*/Cargo.toml", "Cargo.toml"]

[layer.tests]
paths = ["crates/*/tests/**", "crates/*/examples/**", "tools/tests/**", ".claude/hooks/tests/**", "ops/db/tests/**"]

[layer.apparatus]
paths = [
  "tools/**", "ops/checks/**", "ops/db/**", "ops/firstmate/**", "ops/roster/**",
  ".claude/hooks/**", ".claude/commands/**", ".claude/settings.json", ".claude/README.md",
  "justfile", "gate.toml", "deny.toml", "layers.toml", "systemd/**", "hee4.env", ".gitignore",
]

[layer.governance]
paths = ["CHARTER.md", "CLAUDE.md", "README.md", "START.md", "plan/**", "docs/**", "ops/v3-independence-exclusions.txt"]

[layer.planning]
paths = ["modules/**", "gates/**", "brain/**", "agents/**", "runbooks/**", ".claude/agents/**", ".claude/skills/**", "crates/*/FLOW.md"]

# Excluded from every denominator. A row without a reason excludes nothing (tools/layers refuses it).
[[exclude]]
path = "migrated/"
reason = "staged verbatim v3 HARDEN modules, kept as indicated (V4-10)"

[[exclude]]
path = "Cargo.lock"
reason = "generated by cargo from Cargo.toml; nobody authors its lines"

[bounds]
# v2 reached 1.98x (SA:35); the direction is down toward forge's 0.11x (DRIFT D-05 :139, REQUIREMENTS rank 10).
# Above the bound tools/layers refuses the cut without a --reason.
apparatus_ratio_max = 2.0
# AP-08: a file past this many lines is named with over=yes; informational, never a refusal.
largest_file_trigger = 1500
