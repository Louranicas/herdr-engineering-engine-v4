# The gate, declared once (REQUIREMENTS ranks 1 and 6). `tools/gate TIER` is the only runner.
# A tier is its `includes` tier's steps, then its own. Every step has budget_s (the runner refuses
# a step without one). `expect` says what the step must have LOOKED AT (AP-29); no count literal
# lives here (AP-28): a relation ("more than none ran") is the only expectation.
#   expect = "none"        rc only
#   expect = "tests_ran"   cargo test output must report tests that ran (sum of "N passed" > 0)
#   expect = "ddf_sealed"  stdout is ddf JSON with input_sha256; rc 7 is FAIL with the stderr reason
#   expect = "tool_rc"     a tools/ script that prints its own lines; rc 0 only (rc 3 = UNMEASURED = red)

[gate]
base = "HEAD~1"            # `stack` diffs <base>..<subject>; override with --base

[tier.commit]
steps = ["features", "lints", "deps", "fmt", "clippy", "test"]

[tier.stack]
includes = "commit"
steps = ["ddf"]

[tier.cut]
includes = "stack"
steps = ["drill", "drive", "doctor", "advisories"]

[step.features]
cmd = "tools/features-check --served"
budget_s = 30
expect = "tool_rc"

[step.lints]
# lints only get stricter: Cargo.toml against tools/lint-floor.toml, plus allow/cfg_attr/rustflags in the tree
cmd = "tools/lint-ratchet"
budget_s = 30
expect = "tool_rc"

[step.deps]
# cargo-deny, offline: licenses (deny.toml allow-list), bans (no duplicate versions, no wildcards),
# sources (crates.io only). Advisories need a live database: not a commit-tier fact.
cmd = "cargo-deny --offline check bans licenses sources"
budget_s = 60
expect = "none"

[step.fmt]
cmd = "cargo fmt --all -- --check"
budget_s = 60
expect = "none"

[step.clippy]
cmd = "cargo clippy --workspace --all-targets -- -D warnings"
budget_s = 600
expect = "none"

[step.test]
cmd = "cargo test --workspace"
budget_s = 600
expect = "tests_ran"

[step.ddf]
# runs `git diff <base>..<subject>` (code and docs together) into this command
cmd = "deep-diff-forge --stdin-patch --rank --json --require-files --require-hunks"
budget_s = 60
expect = "ddf_sealed"

[step.drill]
cmd = "tools/drill --submit 3"
budget_s = 120
expect = "tool_rc"

[step.doctor]
cmd = "tools/doctor"
budget_s = 60
expect = "tool_rc"

[step.drive]
cmd = "tools/drive --doctor-first --allow-restart --ledger ${HOME}/.local/share/hee4/ledger.sqlite3"
budget_s = 120
expect = "tool_rc"

[step.advisories]
# RustSec advisories at the cut (V4-101 follow-up): fetches the database, names its revision and age;
# a stale (> 7 days) or unfetched database is UNMEASURED (rc 3), which is red. Not a commit-tier fact.
cmd = "tools/advisories"
budget_s = 300
expect = "tool_rc"
